name: flutter_common_kit
description: A complete, production-ready Flutter toolkit containing reusable UI components, centralized Dio API service, local & secure storage, network connectivity, error handling, and utilities.
version: 0.0.1
homepage: https://github.com/Shoeb567/flutter_common_kit
repository: https://github.com/Shoeb567/flutter_common_kit
issue_tracker: https://github.com/Shoeb567/flutter_common_kit/issues

topics:
  - ui-components
  - dio-api
  - local-storage
  - utilities
  - connectivity

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.1.0
  intl: ^0.19.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
